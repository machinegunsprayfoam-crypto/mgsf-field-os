<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Your Project — Machine Gun Spray Foam</title>
<style>
  :root{--or:#f97316;--bg:#0a0a12;--s1:#12121c;--s2:#1a1a26;--bd:#2a2a3a;--tx:#e8e8f0;--t2:#8a8a9a;--gr:#22c55e}
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased;margin:0;padding:22px 16px}
  .wrap{max-width:520px;margin:0 auto}
  .badge{display:inline-block;font-size:11px;letter-spacing:.12em;color:var(--or);border:1px solid var(--bd);border-radius:20px;padding:4px 12px;margin-bottom:14px;text-transform:uppercase}
  h1{font-size:24px;line-height:1.15;margin:0 0 4px}
  h1 span{color:var(--or)}
  .sub{color:var(--t2);font-size:14px;margin-bottom:18px}
  .card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:18px 16px;margin-top:14px}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd)}
  .row:last-child{border-bottom:none}
  .k{color:var(--t2);font-size:13px}
  .v{font-weight:700;text-align:right}
  .status{display:inline-block;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.35);color:var(--gr);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:700}
  .quote{font-size:28px;font-weight:800;color:var(--or)}
  .doc{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--bd);border-radius:9px;padding:10px 12px;margin-top:8px;font-size:14px}
  .cta{display:block;width:100%;text-align:center;margin-top:16px;background:var(--or);color:#000;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:800;text-decoration:none;letter-spacing:.02em}
  .foot{text-align:center;color:var(--t2);font-size:12px;margin-top:22px;line-height:1.7}
  .foot a{color:var(--or);text-decoration:none}
  .msg{text-align:center;padding:40px 10px;color:var(--t2)}
  .msg .big{font-size:40px}
</style>
</head>
<body>
<div class="wrap">
  <span class="badge">Machine Gun Spray Foam</span>
  <h1>Your <span>Project</span></h1>
  <div class="sub">Live status with Machine Gun Spray Foam &amp; Concrete Lifting.</div>
  <div id="out"><div class="msg"><div class="big">⏳</div><div>Loading your project…</div></div></div>
  <div class="foot">
    Questions? <a href="tel:+14069398301">406-939-8301</a> · <a href="mailto:clifton@machinegunsprayfoam.info">Email us</a><br>
    Veteran-owned · MT · ND · SD · WY
  </div>
</div>
<script>
  var E=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});};
  function money(n){return "$"+Number(n).toLocaleString("en-US",{maximumFractionDigits:0});}
  function param(k){try{return new URLSearchParams(location.search).get(k)||"";}catch(e){return "";}}
  function render(v){
    var rows="";
    if(v.service) rows+='<div class="row"><span class="k">Service</span><span class="v">'+E(v.service)+'</span></div>';
    rows+='<div class="row"><span class="k">Status</span><span class="v"><span class="status">'+E(v.status)+'</span></span></div>';
    if(v.scheduled) rows+='<div class="row"><span class="k">Scheduled</span><span class="v">'+E(v.scheduled)+'</span></div>';
    var quote = (v.quote!=null) ? '<div class="card"><div class="k" style="margin-bottom:6px">Your quote</div><div class="quote">'+money(v.quote)+'</div><div class="k" style="margin-top:6px">Reviewed &amp; approved with you — not a bill.</div></div>' : '';
    var docs="";
    if(v.awaitingSignature && v.awaitingSignature.length){
      docs='<div class="card"><div class="k" style="margin-bottom:4px">Waiting on your signature</div>';
      v.awaitingSignature.forEach(function(d){ docs+='<div class="doc">✍️ '+E(d)+'</div>'; });
      docs+='</div>';
    }
    // "Accept this quote" — only offered when there's a quote and the job isn't already booked/complete.
    var st=String(v.status||"").toLowerCase();
    var canAccept = (v.quote!=null) && !/scheduled|underway|progress|complete|paid|booked/.test(st);
    var accept = canAccept ? '<button class="cta" id="acceptBtn" onclick="acceptQuote()">✓ Accept this quote</button>'+
      '<div class="foot" style="margin-top:6px">Accepting lets us know you\'re ready — we\'ll call to confirm and schedule. Nothing is booked automatically.</div>' : '';
    document.getElementById("out").innerHTML=
      '<div class="card"><div class="row"><span class="k">Customer</span><span class="v">'+E(v.customer)+'</span></div>'+rows+'</div>'+
      quote+docs+accept+
      '<a class="cta" href="tel:+14069398301" style="'+(canAccept?'background:transparent;color:var(--or);border:1px solid var(--or)':'')+'">Call about my project</a>';
  }
  function acceptQuote(){
    var t=param("token")||param("t"); var btn=document.getElementById("acceptBtn");
    if(btn){ btn.disabled=true; btn.textContent="Sending…"; }
    fetch("/api/portal",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"accept",token:t})})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d&&d.ok&&d.accepted){ document.getElementById("out").innerHTML='<div class="msg"><div class="big">✅</div><div><b>Thank you'+(d.customer?(", "+E(d.customer)):"")+"!</b><br>We got it — we\'ll call to confirm and schedule your job.</div></div>"; }
        else { if(btn){ btn.disabled=false; btn.textContent="✓ Accept this quote"; } alert("Sorry, that didn\'t go through. Please call us at 406-939-8301."); }
      })
      .catch(function(){ if(btn){ btn.disabled=false; btn.textContent="✓ Accept this quote"; } alert("Something went wrong. Please call us at 406-939-8301."); });
  }
  function fail(msg){ document.getElementById("out").innerHTML='<div class="msg"><div class="big">🔒</div><div>'+E(msg)+'</div></div>'; }
  (function(){
    var t=param("token")||param("t");
    if(!t){ fail("This link is missing its access code. Please use the full link we sent you."); return; }
    fetch("/api/portal?token="+encodeURIComponent(t))
      .then(function(r){return r.json();})
      .then(function(d){
        if(d && d.ok && d.view) render(d.view);
        else if(d && d.configured===false) fail("The portal isn't switched on yet. Please call us for your status.");
        else fail("We couldn't find a project for this link. Please call and we'll help right away.");
      })
      .catch(function(){ fail("Something went wrong loading your project. Please call us."); });
  })();
</script>
</body>
</html>
